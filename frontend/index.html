<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bug Investigation Copilot</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>Bug Investigation Copilot</h1>
    <p class="muted">Read-only investigation across Jira · Confluence · GitHub via MCP</p>
  </header>

  <section class="panel">
    <h2>Analyze a bug</h2>
    <div class="row">
      <input id="issueKey" placeholder="Jira issue key (try DEMO-1)" value="DEMO-1" />
      <input id="repos" placeholder="Repos (comma-separated, e.g. acme/web-app)" />
      <button id="analyze">Analyze Bug</button>
    </div>
    <p class="muted small" id="status"></p>
  </section>

  <section class="panel">
    <h2>Recent investigations</h2>
    <table id="invList">
      <thead><tr><th>Issue</th><th>Status</th><th>Updated</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="panel" id="reportPanel" hidden>
    <h2>Report</h2>
    <div id="reportMeta" class="meta"></div>
    <pre id="reportMarkdown"></pre>
    <details><summary>Raw payload</summary><pre id="reportPayload"></pre></details>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
